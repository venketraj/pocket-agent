<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madurai Sangamam · Feedback</title>
<style>
  :root { --bg: #0f1420; --card: #182033; --text: #e8ecf4; --muted: #9aa6bd; --accent: #f5b942; --ok: #4cc38a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.5 "Segoe UI", system-ui, sans-serif; padding: 32px 16px; }
  .card { max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 14px; padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  p.sub { margin: 0 0 22px; color: var(--muted); }
  label { display: block; margin: 14px 0 6px; font-weight: 600; }
  input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #33405c; background: #0f1420; color: var(--text); font: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  button { margin-top: 22px; width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #1a1a1a; font: 700 18px "Segoe UI", sans-serif; cursor: pointer; }
  .thanks h1 { color: var(--ok); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin-top: 16px; }
  dt { color: var(--muted); }
</style>
</head>
<body>
<main class="card" id="card">
  <h1>🐈 Session feedback</h1>
  <p class="sub">Madurai Sangamam · Dev Carnival 2027 pre-conference</p>
  <form id="f">
    <label for="name">Your name</label>
    <input id="name" name="name" required>

    <label for="session">Session attended</label>
    <select id="session" name="session">
      <option>Opening keynote</option>
      <option>Morning talks</option>
      <option>Pocket-Sized Brains</option>
      <option>Other</option>
    </select>

    <label for="rating">Rating (1-5)</label>
    <select id="rating" name="rating">
      <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
    </select>

    <label for="try_next">One thing you'll try</label>
    <textarea id="try_next" name="try_next"></textarea>

    <label for="improve">One thing the speaker can do better</label>
    <textarea id="improve" name="improve"></textarea>

    <button type="submit">Send feedback</button>
  </form>
</main>
<script>
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    window.__submitted = data;
    const card = document.getElementById("card");
    card.className = "card thanks";
    card.innerHTML = "<h1>✅ Thank you, " + data.name.replace(/[<&]/g, "") + "!</h1><p class='sub'>Feedback received.</p><dl></dl>";
    const dl = card.querySelector("dl");
    for (const [k, v] of Object.entries(data)) {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v;
      dl.append(dt, dd);
    }
  });
</script>
</body>
</html>
